<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720"><rect width="800" height="720" rx="20" fill="#112b37"/><g font-family="Arial, sans-serif"><text x="40" y="49" fill="#79dfc5" font-size="16" letter-spacing="3">HOW TO USE</text><text x="40" y="91" fill="white" font-size="29" font-weight="bold">Para Alpine Analysis</text><rect x="28" y="125" width="744" height="166" rx="14" fill="#1b3b49"/><g transform="translate(48 160)" fill="none" stroke="#79dfc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="25" y="10" width="54" height="78" rx="9"/><path d="M42 22h20M44 76h16M38 43l10 10 20-22"/></g><text x="179" y="164" fill="#79dfc5" font-size="17">01</text><text x="222" y="165" fill="white" font-size="25" font-weight="bold">Record with your phone</text><text x="179" y="210" fill="#d1e3e9" font-size="21">Record GPS, accelerometer, and gyroscope.</text><text x="179" y="243" fill="#d1e3e9" font-size="21">Export the sensor recordings as CSV files.</text><rect x="28" y="310" width="744" height="166" rx="14" fill="#1b3b49"/><g transform="translate(48 345)" fill="none" stroke="#79dfc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="52" cy="49" r="36"/><circle cx="52" cy="49" r="21"/><path d="M52 4v22M52 72v22M7 49h22M76 49h22"/><circle cx="60" cy="40" r="4" fill="#79dfc5"/></g><text x="179" y="349" fill="#79dfc5" font-size="17">02</text><text x="222" y="350" fill="white" font-size="25" font-weight="bold">Load the sensor folder</text><text x="179" y="395" fill="#d1e3e9" font-size="21">Include Location.csv, Accelerometer.csv,</text><text x="179" y="428" fill="#d1e3e9" font-size="21">and Gyroscope.csv in your data folder.</text><rect x="28" y="495" width="744" height="166" rx="14" fill="#1b3b49"/><g transform="translate(48 530)" fill="none" stroke="#79dfc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14v72h80M26 64l18-23 17 10 26-29"/><path d="M26 76V64M44 76V53M62 76V62M86 76V35"/></g><text x="179" y="534" fill="#79dfc5" font-size="17">03</text><text x="222" y="535" fill="white" font-size="25" font-weight="bold">Analyze the run</text><text x="179" y="580" fill="#d1e3e9" font-size="21">Explore the route, speed, and elevation.</text><text x="179" y="613" fill="#d1e3e9" font-size="21">Review movement signals and course sections.</text></g></svg>